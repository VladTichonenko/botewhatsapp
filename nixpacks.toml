# Конфигурация Nixpacks для Railway
# Устанавливает системные зависимости для Puppeteer/Chrome

[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = [
  "apt-get update",
  "apt-get install -y wget gnupg ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release xdg-utils",
  "npm install"
]

[start]
cmd = "node index.js"

