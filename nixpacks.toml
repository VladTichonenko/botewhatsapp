# Конфигурация Nixpacks для Railway
# ВАЖНО: Railway теперь использует Dockerfile (см. railway.json)
# Этот файл используется только если Dockerfile недоступен

[phases.setup]
nixPkgs = [
  "nodejs-18_x",
  "glib",
  "nss",
  "nspr",
  "atk",
  "at-spi2-atk",
  "cups",
  "dbus",
  "gtk3",
  "libxkbcommon",
  "libXcomposite",
  "libXdamage",
  "libXfixes",
  "libXrandr",
  "libgbm",
  "libXScrnSaver",
  "alsa-lib"
]

[phases.install]
cmds = ["npm install"]

[start]
cmd = "node index.js"

